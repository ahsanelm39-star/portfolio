<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="32" fill="url(#avatarGlow)" />
  <rect width="600" height="600" rx="32" fill="none" stroke="url(#avatarBorder)" stroke-width="2" />

  <!-- Subtle Studio Grid -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="600" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="600" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Abstract Executive Portrait Silhouette -->
  <g transform="translate(150, 120)">
    <!-- Ambient Head Glow -->
    <circle cx="150" cy="110" r="85" fill="#38bdf8" opacity="0.12" filter="blur(20px)" />
    <!-- Head Outline / Stylized Profile -->
    <circle cx="150" cy="100" r="68" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Shoulders / Torso Silhouette -->
    <path d="M 40 290 C 40 210, 100 195, 150 195 C 200 195, 260 210, 260 290 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Monogram / Emblem -->
    <text x="150" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">A</text>
  </g>

  <!-- Badge Overlay -->
  <g transform="translate(120, 480)">
    <rect width="360" height="54" rx="27" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="32" cy="27" r="5" fill="#10b981" />
    <text x="50" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">WHITE-LABEL AGENCY PARTNER</text>
  </g>
</svg>
